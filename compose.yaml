# AID — dev-окружение через Docker Compose.
#
# Запуск:    docker compose up
# Остановка: docker compose down
# Сброс БД:  rm -rf .data/mongo                # ⚠️ удалит данные!
#
# После старта открывай https://localhost (Caddy выдаст сертификат
# автоматически через свой локальный CA). HTTP → HTTPS редирект
# встроен в Caddy.
#
# Структура:
#   caddy   — единая точка входа на :80/:443, авто-HTTPS для localhost,
#             проксирует /api/* и статику. Сертификаты в named volume
#             (должны переживать перезапуски).
#   mongo   — MongoDB 8, данные в bind-mount `./.data/mongo` (внутри
#             проекта, в .gitignore)
#   mgob    — агент бэкапов Mongo (maxisam/mgob:2.0.28), архивы в
#             bind-mount `./.data/mongo-backups` (внутри проекта,
#             ТРЕКАЕТСЯ в git). UI/API на :8090 (только localhost)
#   server  — наш Express-бэкенд из apps/server
#   client  — Vue-фронтенд из apps/client (Vite dev-сервер)
#
# server и client собраны из одного Dockerfile (см. Dockerfile в корне).
# Исходники монтируются bind-mount'ами — правки в src/ видны без пересборки.

name: aid

services:
  # -----------------------------------------------------------------------
  # Caddy — единая точка входа на :80/:443 с авто-HTTPS
  # -----------------------------------------------------------------------
  # Проксирует /api/* на server:3000, всё остальное — на client:4173.
  # Включая WebSocket для Vite HMR (Caddy делает это сам).
  # Конфиг: infra/caddy/Caddyfile.
  #
  # Авто-HTTPS: для `localhost` Caddy использует свой встроенный CA (XCA)
  # и сохраняет сертификаты в named volume `caddy_data`. При первом
  # запуске сертификат генерируется автоматически, HTTP → HTTPS редирект
  # включён по умолчанию.
  #
  # ⚠️ Браузер покажет "не доверен" пока ты не добавишь корневой CA
  # Caddy в trust store. Подробнее — см. README раздел "HTTPS".
  caddy:
    image: caddy:2-alpine
    container_name: aid-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Named volumes для сертификатов и конфига Caddy. Без них Caddy будет
      # пересоздавать сертификаты при каждом перезапуске.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - client
      - server

  # -----------------------------------------------------------------------
  # MongoDB — хранилище данных
  # -----------------------------------------------------------------------
  # Данные лежат в bind-mount `./.data/mongo` (внутри проекта, в .gitignore).
  # Bind-mount вместо named volume: данные живут рядом с кодом, видно глазами,
  # легко бэкапить, удалять и мигрировать. Недостаток — зависят от пути проекта.
  # Каталог должен существовать ДО первого `docker compose up` (либо создать
  # руками, либо через `git clone` + `mkdir -p .data/mongo`).
  mongo:
    image: mongo:8
    container_name: aid-mongo
    restart: unless-stopped
    ports:
      # Пробрасываем порт, чтобы можно было подключиться извне
      # (mongosh, Compass, Robo 3T). Внутри compose server ходит
      # по имени `mongo` через `MONGO_URI`.
      - "27017:27017"
    volumes:
      - ./.data/mongo:/data/db
    healthcheck:
      # Проверяем, что mongosh отвечает; сервер ждёт этой проверки
      # через `depends_on: condition: service_healthy`.
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # -----------------------------------------------------------------------
  # Server — Express + Mongoose
  # -----------------------------------------------------------------------
  # Собирается из локального Dockerfile (один образ, разные команды —
  # см. CMD в Dockerfile, здесь переопределяем через `command:`).
  #
  # Смонтированы ТОЛЬКО src/ и packages/ (read-only):
  #   - node_modules лежит в образе — там корректные Linux-symlinks от pnpm,
  #     bind-mount с хоста на Windows их бы поломал
  #   - правки в server/src/ подхватываются на лету (tsx watch в dev-скрипте
  #     перезапускает процесс; сейчас скрипт без watch из-за stdio-проблем
  #     под concurrently, но в Docker это не актуально)
  #   - правки в packages/ тоже подхватываются (volumes перекрывают образ)
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aid-server
    restart: unless-stopped
    # Запускаем dev-скрипт только для @aid/server (не весь concurrently).
    command: pnpm --filter @aid/server dev
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      # Внутри compose host'ом БД является сервис `mongo`, а не localhost.
      MONGO_URI: mongodb://mongo:27017/aid
      MONGO_DB_NAME: aid
      NODE_ENV: development
      LOG_LEVEL: info
      # mgob внутри compose-сети доступен по имени сервиса.
      MGOB_URL: http://mgob:8090
      # Bind-mount с архивами — тот же каталог, что видит mgob через
      # свой /storage. Server читает напрямую (list/download), restore
      # делает mgob через собственный mount.
      BACKUPS_DIR: /backups
      # Telegram-стейт (chat_id, enabled) — RW, отдельный mount, чтобы
      # /backups оставался read-only. TELEGRAM_* берутся из .env через
      # env_file ниже — если файла нет, .env.example как шаблон, фича
      # выключена по дефолту.
      TELEGRAM_STATE_DIR: /data
      # Файловое хранилище: в compose — /files (bind-mount ниже).
      # В локальном dev — .data/file_store относительно cwd.
      FILE_STORE_DIR: /files
    env_file:
      # Подтягивает переменные из корневого .env (см. .env.example).
      # `required: false` — если файла нет, compose не падает, нотификатор
      # остаётся выключенным (TELEGRAM_BOT_TOKEN пустой по дефолту).
      - path: .env
        required: false
    volumes:
      # :ro — read-only, чтобы контейнер случайно не затёр хост-исходники.
      - ./apps/server/src:/app/apps/server/src:ro
      - ./packages:/app/packages:ro
      # Архивы бэкапов — read-only на хосте, чтобы server не мог их побить.
      - ./.data/mongo-backups:/backups:ro
      # Telegram-стейт: read-write. Сюда пишется chat_id и runtime enabled.
      - ./.data:/data
      # Файлы: read-write. Можно поменять source на отдельный диск —
      # например /mnt/external/files:/files, контейнер этого не заметит.
      - ./.data/file_store:/files
    depends_on:
      # Не стартовать, пока Mongo не пройдёт healthcheck.
      mongo:
        condition: service_healthy
      # И пока mgob не поднимется (нужен для trigger/status/restore).
      mgob:
        condition: service_started

  # -----------------------------------------------------------------------
  # Client — Vue 3 + Vite dev-сервер
  # -----------------------------------------------------------------------
  # Vite слушает на 0.0.0.0:4173 (см. vite.config.ts). Порт пробрасываем
  # для прямого доступа в обход caddy (удобно для отладки — иначе HMR
  # может путаться через двойной прокси).
  # /api/* дублируется в двух местах:
  #   1) caddy :443 → server:3000  (основной путь для пользователя)
  #   2) Vite  :4173 → server:3000 (для прямого доступа на 4173)
  #
  # CHOKIDAR_USEPOLLING=true — Vite chokidar на bind-mount'ах Docker под
  # Linux/Windows не получает нативные FS-события, нужен polling.
  # На Linux-хосте с нативным watching это можно отключить.
  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aid-client
    restart: unless-stopped
    command: pnpm --filter @aid/client dev
    working_dir: /app
    ports:
      - "4173:4173"
    environment:
      # Vite dev-сервер (внутри client-контейнера) проксирует /api/* сюда.
      VITE_SERVER_URL: http://server:3000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/client/src:/app/apps/client/src:ro
      - ./packages:/app/packages:ro
    # `server` тут без healthcheck — Vite сам переподключится, когда
    # server поднимется. depends_on тут только для порядка старта.
    depends_on:
      - server

  # -----------------------------------------------------------------------
  # Backup agent — mgob (maxisam/mgob:2.0.28, форк активного stefanprodan/mgob)
  # -----------------------------------------------------------------------
  # Web UI и HTTP API на :8090 — только с localhost, без TLS и без auth.
  # В production за прокси не выставлять. План бэкапа — infra/mgob/config/aid.yaml
  # (имя файла == plan ID, без пробелов и спецсимволов).
  #
  # Архивы mongodump лежат в bind-mount `./.data/mongo-backups` (внутри проекта,
  # ТРЕКАЕТСЯ в git — бэкапы версионируются вместе с кодом). Каталог должен
  # существовать до первого запуска; `git clone` создаст его автоматически,
  # т.к. в репо лежит `.gitkeep`.
  #
  # Cron и retention настраиваются в YAML-плане. Восстановление — `mongorestore`
  # (см. infra/mgob/README.md).
  #
  # Совместимость: официальная матрица maxisam/mgob — MongoDB 7.0, но встроенный
  # mongodump 7.0 совместим с 8.x по wire-протоколу. Проверено вживую при
  # первом запуске (см. ADR-0011).
  mgob:
    image: maxisam/mgob:2.0.28
    container_name: aid-mgob
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./infra/mgob/config:/config:ro
      - ./.data/mongo-backups:/storage
    depends_on:
      mongo:
        condition: service_healthy

# -----------------------------------------------------------------------
# Named volumes
# -----------------------------------------------------------------------
# Остались только Caddy — они должны переживать `docker compose down`,
# чтобы TLS-сертификаты не перевыпускались каждый раз. Данные Mongo и
# бэкапы mgob переехали на bind-mounts в `.data/` (см. описание сервисов).
#
# Полезные команды:
#   docker volume ls                              # список всех томов
#   docker volume inspect aid-caddy-data          # где физически лежит
#   docker compose down -v                        # ⚠️ удалит И Caddy-тома тоже
#   docker volume rm aid-caddy-data aid-caddy-config   # полная очистка Caddy
volumes:
  caddy_data:
    name: aid-caddy-data
  caddy_config:
    name: aid-caddy-config
